# Comprueba cada push y cada pull request: si algo falla, GitHub lo marca
# en rojo antes de que llegue a producción.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm # reutiliza las dependencias descargadas entre ejecuciones

      # npm ci instala exactamente lo que dice package-lock.json.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # `run` ejecuta las pruebas una vez, sin quedarse vigilando cambios.
      - run: npm run test -- run
      - run: npm run build
