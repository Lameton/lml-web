# Dependabot revisa cada semana si hay versiones nuevas de las dependencias
# y abre una pull request con la actualización; la CI la comprueba antes de
# que la aceptes. Las versiones menores y los parches van agrupados en una
# sola pull request para no llenar el repositorio de avisos.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      menores:
        update-types: [minor, patch]
    ignore:
      # Los tipos de Node deben coincidir con la versión que ejecuta la web
      # (22, ver "engines" en package.json): se sube a mano al cambiar de Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
